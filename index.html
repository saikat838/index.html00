<!DOCTYPE html>
<html lang="bn">
<head>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>SatheAchi.com</h1>
<p>Trusted Shopping Partner</p>
</header>

<div class="container">

<div class="product">

<img src="product.jpg" alt="Product">

<h3>৳399</h3>

<textarea placeholder="সম্পূর্ণ ঠিকানা"></textarea>

<button type="submit">
অর্ডার কনফার্ম করুন
</button>

</form>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
